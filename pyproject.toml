[project]
name = "hsv-sphere"
version = "0.1.0"
description = "Interactive image color-space visualizations with Plotly"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib>=3.10,<4",
    "numpy>=2.3.4,<3",
    "opencv-python>=4.11,<5",
    "pillow>=12,<13",
    "plotly>=6.3,<7",
    "scikit-image>=0.25.2,<0.26",
]

[tool.uv]
package = false
